[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-performance-benchmarking"
version = "0.5.0"
description = "Uncertainty-aware risk-adjusted portfolio benchmarking with joint dependence modeling."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dr. Muhammad Shoaib" }
]
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]
keywords = [
    "quantitative-finance",
    "portfolio-benchmarking",
    "stochastic-frontier-analysis",
    "factor-models",
]

[project.urls]
Repository = "https://github.com/drmshoaib/latent-performance-benchmarking"

[project.optional-dependencies]
dev = [
    "jinja2>=3.1,<4",
    "pytest>=8,<10",
    "reportlab>=4.2,<5",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["analysis*", "sfa*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv", "results", "latex_tables"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"reports/generate_report.py" = ["E501"]
